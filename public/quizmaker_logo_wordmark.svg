<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 320" width="520" height="640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="55%" stop-color="#8B3DFF"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="tail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B3DFF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3B0764" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Mark, centred horizontally -->
  <g transform="translate(30 0)">
    <g filter="url(#soft)">
      <circle cx="100" cy="128" r="52" fill="none" stroke="url(#violet)" stroke-width="30"/>
      <path d="M 112 92 Q 152 70 168 14 Q 160 62 148 100 Z" fill="url(#tail)"/>
    </g>
    <circle cx="100" cy="128" r="24" fill="none" stroke="#1E1B4B" stroke-width="12"
            stroke-linecap="round" stroke-dasharray="112 200" transform="rotate(-100 100 128)"/>
  </g>

  <!-- Wordmark -->
  <text x="130" y="283" text-anchor="middle"
        font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
        font-size="36" font-weight="600" letter-spacing="1.5" fill="#1E1B4B">Quizmaker</text>
</svg>
